<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#0b0f14">
  <title>TRAVELZ</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="assets/styles.css">
  <script src="assets/gate-config.js" defer></script>
  <script src="assets/gate.js" defer></script>
  <script src="assets/home.js" defer></script>
</head>
<body>
  <section class="gate" id="gate" aria-label="Travelz unlock">
    <div class="gate-card">
      <div class="brand">TRAVELZ</div>
      <div class="gate-plane">✈</div>
      <form id="gate-form" autocomplete="off">
        <label class="sr-only" for="gate-pin">PIN</label>
        <input id="gate-pin" class="pin-input" type="password" inputmode="numeric" autocomplete="off" placeholder="••••••" maxlength="16">
        <button class="primary" type="submit">unlock</button>
      </form>
      <p class="gate-message" id="gate-message" aria-live="polite"></p>
    </div>
  </section>

  <div id="app" hidden>
    <header class="topbar">
      <a class="brand" href="./">TRAVELZ</a>
      <button class="ghost" type="button" data-lock>lock</button>
    </header>

    <main class="shell">
      <section class="hero">
        <p class="eyebrow">travel hub</p>
        <h1>Trips, tickets, money notes and the bits that matter.</h1>
        <p class="lede">Public-safe dashboard. Sensitive documents stay in the private vault.</p>
      </section>

      <section class="section-head">
        <div>
          <p class="eyebrow">current</p>
          <h2>Active trip</h2>
        </div>
      </section>
      <div id="trip-list" class="trip-grid" aria-live="polite"></div>

      <section class="section-head archive-head">
        <div>
          <p class="eyebrow">archive</p>
          <h2>Previous trips</h2>
        </div>
      </section>
      <div class="empty-card">Nothing archived yet. Future Stan can leave archaeology here.</div>
    </main>

    <footer class="footer">TRAVELZ · static on purpose</footer>
  </div>
</body>
</html>
